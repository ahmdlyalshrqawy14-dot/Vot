name: Test Phase 1 - Expand Script

on:
  workflow_dispatch: # يتيح لك تشغيل الاختبار يدوياً بضغطة زر

jobs:
  expand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script Expansion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/expand_script.py

      - name: Upload Expanded Episode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: current_episode_json
          path: current_episode.json
          retention-days: 5
