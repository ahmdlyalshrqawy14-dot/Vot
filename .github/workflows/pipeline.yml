name: 5-Min Video Production Pipeline

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'رقم الحلقة (اتركه فارغاً لأخذ التالية):'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          TARGET_EPISODE_ID: ${{ inputs.episode_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_IMAGE_KEY: ${{ secrets.AZURE_IMAGE_KEY }}
          AZURE_IMAGE_ENDPOINT: ${{ secrets.AZURE_IMAGE_ENDPOINT }}
          AZURE_IMAGE_DEPLOYMENT: ${{ secrets.AZURE_IMAGE_DEPLOYMENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-episode-video
          path: output/episode_*/final_video.mp4
          retention-days: 7

      - name: Commit Status Update Only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto: Completed episode run"
            git pull --rebase origin main
            git push origin main
          fi
