name: Test Pipeline (Phase 1 & Phase 2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase 1 (Script Expansion)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/expand_script.py

      - name: Run Phase 2 (Audio & Sync Engine)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python src/generate_audio.py

      - name: Upload Audio & Sync Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio_and_sync_package
          path: |
            current_episode.json
            audio/full_voiceover.mp3
            audio/sync_map.json
          retention-days: 5
