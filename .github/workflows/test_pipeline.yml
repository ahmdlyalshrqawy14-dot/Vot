name: Full Production Test (Phases 1, 2 & 3)

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase 1 (Script Expansion)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/expand_script.py

      - name: Run Phase 2 (Audio & Sync Engine)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python src/generate_audio.py

      - name: Run Phase 3 (Parallel Image Engine)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python src/generate_images.py

      - name: Upload Episode Assets
        uses: actions/upload-artifact@v4
        with:
          name: episode_full_assets
          path: |
            current_episode.json
            audio/full_voiceover.mp3
            audio/sync_map.json
            images/timeline/
            images/thumbnails/
          retention-days: 5
